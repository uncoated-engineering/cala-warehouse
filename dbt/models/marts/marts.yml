version: 2

models:
  - name: fct_entries
    description: One row per double-entry line. The grain everything sits on.
    columns:
      - name: entry_id
        tests: [unique, not_null]
      - name: transaction_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_transactions')
                field: transaction_id
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: journal_id
        tests: [not_null]
      - name: units
        tests: [not_null]

  - name: fct_transactions
    description: One row per transaction with entry aggregates and the per-currency balance check.
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: is_balanced
        tests:
          - accepted_values: {arguments: {values: [true]}}
      - name: entry_count
        description: Every transaction must have at least two entries.
        tests:
          - dbt_utils_free_at_least: {arguments: {value: 2}}

  - name: fct_account_balances
    description: >
      Balances recomputed from fct_entries at the full grain. Independent of
      cala_current_balances; see assert_balances_reconcile.
    columns:
      - name: dr_balance
        tests: [not_null]
      - name: cr_balance
        tests: [not_null]
      - name: layer
        tests:
          - accepted_values: {arguments: {values: [settled, pending, encumbrance]}}
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [journal_id, account_id, currency, layer]

  - name: rpt_trial_balance
    description: Per journal, currency and layer, total debits, total credits and their difference.
    columns:
      - name: difference
        description: Must be zero on every row of a correct ledger.
        tests:
          - accepted_values:
              arguments:
                values: [0]
                quote: false
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [journal_id, currency, layer]

  - name: dim_accounts
    description: SCD-2 account history, one row per account version.
    columns:
      - name: account_version_key
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
      - name: normal_balance_type
        tests:
          - accepted_values: {arguments: {values: [debit, credit]}}
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [account_id, version_number]
      - dbt_utils_free_scd2_single_current:
          arguments:
            key_column: account_id

  - name: dim_account_sets
    columns:
      - name: account_set_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id

  - name: dim_account_set_members
    description: Transitive closure of set membership; one row per (set, member, path).
    columns:
      - name: depth
        tests:
          - dbt_utils_free_at_least: {arguments: {value: 1}}
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [account_set_id, member_id, path]
