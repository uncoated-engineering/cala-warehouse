version: 2

sources:
  - name: cala
    description: >
      cala-ledger's Postgres tables as landed in the warehouse. Locally these
      are the dbt seeds in fixtures/seed/ (dumped from cala's own integration
      suite); in production they are whatever the extractor lands, with the
      same names. Per es-entity's convention every entity has a mutable
      current-state table and an append-only `*_events` stream with
      UNIQUE(id, sequence).
    schema: raw
    tables:
      # --- append-only event streams (safe to load incrementally on (id, sequence))
      - name: cala_journal_events
      - name: cala_account_events
      - name: cala_account_set_events
      - name: cala_transaction_events
      - name: cala_entry_events
        description: One `initialized` event per double-entry line. The only stream we model incrementally in v0.
      - name: cala_tx_template_events
      - name: cala_persistent_outbox_events
        description: >
          cala's outbox (`OutboxEventPayload`, serde-tagged on `type`). The only
          place account-set membership changes are recorded as events; the
          `*_events` streams do not carry them.

      # --- written by the warehouse itself, not by cala
      - name: cala_erasure_log
        description: >
          The erasure audit log. Appended by `cala-erase` and by every
          `cala-extract` run (extract/cala_extract/erasure.py), never by cala:
          one row per (erasure request, raw table redacted). It may not exist
          on a warehouse that has never erased anything, so models read it
          through the `optional_source` macro. Never edited, never truncated;
          `--full-refresh` of the cala tables leaves it in place.
        columns:
          - name: log_id
            description: Unique per row.
          - name: erasure_id
            description: One per request. A `reapply` row reuses the id of the request it re-applied.
          - name: applied_at
            description: When the redaction ran, naive UTC.
          - name: run_id
            description: The dlt load id of the extraction run, or the cala-erase invocation id.
          - name: source
            description: "operator | forget_event | cascade | reapply. The first three are requests; reapply is a later run redacting rows upstream re-introduced."
          - name: requested_by
            description: Who asked (operator requests), `upstream` for forget events; null otherwise.
          - name: reason
            description: Free text from the request, or the forget event that triggered it.
          - name: entity_kind
            description: "account | account_set | transaction | entry | journal."
          - name: entity_id
            description: The erased entity's id (UUID as string).
          - name: cascade_of
            description: For cascade rows, the erasure_id of the parent request (an account erased with its entries).
          - name: table_name
            description: The raw table this row redacted (a stream, a state table or the outbox).
          - name: fields
            description: JSON array string of the field paths set to null in that table.
          - name: rows_matched
            description: Rows of the table that belong to the entity.
          - name: rows_redacted
            description: Of those, rows that still held a value in at least one field before this run.

      # --- mutable current-state tables (must be replaced, never sequence-watermarked)
      - name: cala_journals
      - name: cala_accounts
      - name: cala_account_sets
      - name: cala_account_set_member_accounts
      - name: cala_account_set_member_account_sets
      - name: cala_tx_templates
      - name: cala_transactions
      - name: cala_entries
      - name: cala_current_balances
        description: >
          cala's own balance projection, one row per (journal, account,
          currency) with the three layers nested in `latest_values`. This is
          what `assert_balances_reconcile` compares our recomputation against.
      - name: cala_balance_history
        description: >
          Every version of every (journal, account, currency) balance cala has
          written, with the three layers nested in `values` exactly as in
          cala_current_balances.latest_values. Not modelled; the MCP server
          reads it directly to reconcile as of a past instant.
        columns:
          - name: journal_id
            description: Journal.
          - name: account_id
            description: Account, including account-set backing accounts.
          - name: currency
            description: Currency code.
          - name: version
            description: Balance version; increases by one per posting that touches the (journal, account, currency).
          - name: values
            description: JSON string with settled / pending / encumbrance objects, each carrying dr_balance, cr_balance, entry_id, modified_at.
          - name: latest_entry_id
            description: The entry that produced this version.
          - name: recorded_at
            description: When cala wrote this version. Wall-clock time, not the entry's recorded_at.
