version: 2

models:
  - name: stg_cala_journals
    description: One row per journal event. Typed columns unpacked from the event JSON.
    columns:
      - name: journal_id
        tests: [not_null]
      - name: sequence
        tests: [not_null]
      - name: event_type
        tests:
          - accepted_values: {arguments: {values: [initialized, updated]}}
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [journal_id, sequence]

  - name: stg_cala_accounts
    description: >
      One row per account event. `changed_fields` is cala's own list of which
      attributes an `updated` event touched.
    config:
      meta:
        grain: [account_id, sequence]
    columns:
      - name: account_id
        description: cala account id.
        tests: [not_null]
      - name: sequence
        description: Event sequence, 1..n per account. The latest event per account is its current state.
      - name: is_account_set
        description: True for the backing account of an account set.
      - name: event_type
        tests:
          - accepted_values: {arguments: {values: [initialized, updated]}}
      - name: normal_balance_type
        tests:
          - accepted_values: {arguments: {values: [debit, credit]}}
      - name: status
        tests:
          - accepted_values: {arguments: {values: [active, locked]}}
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [account_id, sequence]

  - name: stg_cala_account_sets
    columns:
      - name: account_set_id
        tests: [not_null]
      - name: journal_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cala_journals')
                field: journal_id
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [account_set_id, sequence]

  - name: stg_cala_account_set_members
    description: Membership add/remove events replayed from cala's outbox.
    columns:
      - name: outbox_sequence
        tests: [unique, not_null]
      - name: member_kind
        tests:
          - accepted_values: {arguments: {values: [account, account_set]}}
      - name: membership_change
        tests:
          - accepted_values: {arguments: {values: [added, removed]}}

  - name: stg_cala_transactions
    columns:
      - name: transaction_id
        tests: [not_null]
      - name: journal_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_cala_journals')
                field: journal_id
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [transaction_id, sequence]

  - name: stg_cala_entries
    description: >
      One row per entry event, loaded incrementally on (entry_id, sequence).
      `units` is DECIMAL(38,18); the `layer` and `direction` are lower-cased
      to match cala's Postgres enums.
    columns:
      - name: entry_id
        tests: [not_null]
      - name: units
        tests:
          - not_null
          - dbt_utils_free_non_negative
      - name: layer
        tests:
          - accepted_values: {arguments: {values: [settled, pending, encumbrance]}}
      - name: direction
        tests:
          - accepted_values: {arguments: {values: [debit, credit]}}
      - name: currency
        tests: [not_null]
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [entry_id, sequence]

  - name: stg_cala_balances
    description: >
      cala's own balance projection, unpivoted from cala_current_balances to
      the (journal_id, account_id, currency, layer) grain. Nothing downstream
      computes from this; it is the external number the reconciliation
      controls compare against.
    config:
      meta:
        grain: [journal_id, account_id, currency, layer]
    columns:
      - name: journal_id
        description: Journal.
      - name: account_id
        description: Account, including account-set backing accounts (cala keeps rolled-up set balances here).
      - name: currency
        description: Currency code.
      - name: layer
        description: "settled | pending | encumbrance. cala writes all three layers on first touch, so 0/0 rows exist."
        tests:
          - accepted_values: {arguments: {values: [settled, pending, encumbrance]}}
      - name: balance_version
        description: cala's balance version counter for the (journal, account, currency).
      - name: dr_balance
        description: cala's running debit total for the grain. DECIMAL(38,18).
      - name: cr_balance
        description: cala's running credit total for the grain. DECIMAL(38,18).
      - name: latest_entry_id
        description: The entry cala says last touched this layer.
      - name: layer_modified_at
        description: When cala last modified this layer.
      - name: balance_modified_at
        description: When cala last modified any layer of the (journal, account, currency).
    tests:
      - dbt_utils_free_unique_combination:
          arguments:
            combination: [journal_id, account_id, currency, layer]

  - name: stg_cala_erasures
    description: >
      The erasure audit log, one row per (request, raw table redacted) plus
      one row per later re-application. Written by the warehouse, not cala.
    config:
      meta:
        grain: [log_id]
    columns:
      - name: log_id
        description: Unique per row.
        tests: [unique, not_null]
      - name: erasure_id
        description: One per request; reapply rows reuse it.
        tests: [not_null]
      - name: applied_at
        description: When the redaction ran, naive UTC.
      - name: run_id
        description: Extraction load id or cala-erase invocation id.
      - name: erasure_source
        description: "operator | forget_event | cascade are requests; reapply is a later run redacting re-landed rows."
        tests:
          - accepted_values: {arguments: {values: [operator, forget_event, cascade, reapply]}}
      - name: requested_by
        description: Requester, or `upstream` for a forget event.
      - name: reason
        description: Free text from the request.
      - name: entity_kind
        description: "account | account_set | transaction | entry | journal."
        tests:
          - accepted_values: {arguments: {values: [account, account_set, transaction, entry, journal]}}
      - name: entity_id
        description: The erased entity's id.
        tests: [not_null]
      - name: cascade_of
        description: Parent erasure_id for cascade rows.
      - name: table_name
        description: The raw table redacted.
      - name: fields
        description: JSON array string of the field paths nulled.
      - name: rows_matched
        description: Rows of the table belonging to the entity.
      - name: rows_redacted
        description: Rows that held a value before this run.
