[project]
name = "cala-warehouse"
version = "0.1.0"
description = "Portable dbt package + DuckDB harness for es-entity / cala-ledger event data"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "mcp>=2",
]

[dependency-groups]
bigquery = ["dbt-bigquery>=1.9"]
dev = [
    "pytest>=8",
]

[project.scripts]
cala-mcp = "cala_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The dbt package is not Python; the only Python package is the MCP server
# under mcp/. Installed editable by `uv sync`, so `uv run cala-mcp` works.
[tool.hatch.build.targets.wheel]
packages = ["mcp/cala_mcp"]

[tool.pytest.ini_options]
testpaths = ["mcp/tests"]
