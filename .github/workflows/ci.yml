name: dbt build (DuckDB)

# The whole package builds and tests from committed seeds. No credentials, no
# services, no network beyond installing Python packages. The mcp-tests job
# rebuilds the same warehouse and runs the MCP server's pytest suite over it.
# The extract job is the only one with a service: a Postgres that plays cala
# (its real DDL + the seeds), so the extractor is exercised end to end and the
# dbt package is built from what it landed rather than from seeds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # `make build` loads seeds first, then builds models + tests. Staging
      # reads seeds through source(), which dbt does not order after seeds.
      - name: dbt seed, then build (run + test)
        run: make build

      - name: Incremental re-run is a no-op on unchanged seeds
        run: cd dbt && uv run dbt run --select stg_cala_entries

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/run_results.json

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # The tools read manifest.json and the DuckDB file that `make build`
      # writes; there is no other fixture.
      - name: dbt seed, then build
        run: make build

      - name: pytest (MCP tools, in-process server)
        run: make mcp-test

      - name: The stdio server starts and exits on EOF
        run: timeout 20 uv run cala-mcp < /dev/null

  extract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d pg"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CALA_PG_URL: postgres://user:password@127.0.0.1:5432/pg
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # Round trip, incremental load, in-flight and abandoned outbox
      # sequences, wiped warehouse, erasure re-applied across runs and forget
      # events consumed. Each test rebuilds the source database.
      - name: pytest (extractor against Postgres)
        run: make extract-test

      # Then the real flow: seeds -> Postgres -> extractor -> DuckDB -> dbt
      # -> MCP, with no dbt seeds involved.
      - name: Load cala's schema and the seeds into Postgres
        run: uv run python -m cala_extract.fixture_db "$CALA_PG_URL"

      - name: Extract (first load, verified against the snapshot)
        run: make extract

      - name: Extract again (streams load nothing, state tables replaced)
        run: |
          uv run cala-extract --verify --json > extract.json
          python3 -c "import json; s=json.load(open('extract.json')); assert s['rows_loaded']['cala_entry_events'] == 0 and s['watermark_before'] == s['watermark_after'], s"

      - name: dbt build on the extracted tables (no seeds)
        run: make build-extracted

      # Erasure propagation: redact one account and its entries, rebuild,
      # and let assert_erased_entities_hold_no_personal_data prove it while
      # the reconciliation controls prove nothing else moved.
      - name: Erase one account with its entries, rebuild, prove the erasure
        run: |
          ACCOUNT=$(uv run python -c "import duckdb; c=duckdb.connect('dbt/cala_warehouse.duckdb', read_only=True); print(c.execute(\"select a.id from raw.cala_accounts a join raw.cala_entries e on e.account_id = a.id where a.name <> '' group by a.id order by count(*) desc, a.id limit 1\").fetchone()[0])")
          uv run cala-erase account "$ACCOUNT" --with-entries --reason "CI: erasure propagation" --requested-by ci
          make build-extracted

      # The source still holds the name; the next run replaces cala_accounts
      # from it and must redact it again before dbt sees it.
      - name: Extract again re-applies the erasure on the replaced state table
        run: |
          uv run cala-extract --verify --json > extract.json
          python3 -c "import json; s=json.load(open('extract.json')); assert s['erasures_known'] >= 1 and s['erasures_reapplied'].get('cala_accounts') == 1, s"
          make build-extracted

      - name: pytest (MCP tools over the extracted warehouse)
        run: make mcp-test
